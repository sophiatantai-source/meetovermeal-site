<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Invited to MeetOverMeal!</title>
  <meta name="description" content="Your friend invited you to MeetOverMeal — the social dining app. Download now and get a free Super Like!">
  <meta property="og:title" content="You're Invited to MeetOverMeal!">
  <meta property="og:description" content="Your friend invited you to dine together. Download the app, enter their code, and both of you get a free Super Like!">
  <meta property="og:image" content="https://meetovermeal.org/assets/share-card.png">
  <meta property="og:url" content="https://meetovermeal.org/invite">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="You're Invited to MeetOverMeal!">
  <meta name="twitter:description" content="Download the app, enter their invite code, and both of you get a free Super Like!">
  <meta name="twitter:image" content="https://meetovermeal.org/assets/share-card.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F7F5F0;
      --card-bg: #FFFFFF;
      --text-dark: #1C1917;
      --text-muted: #78716C;
      --accent: #E8872D;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 15% 0%, rgba(232, 135, 45, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(232, 135, 45, 0.07) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.3;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 52px 44px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 32px 80px -16px rgba(28,25,23,0.08), 0 0 0 1px rgba(28,25,23,0.04);
      z-index: 1;
      animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
      opacity: 0;
      transform: translateY(24px);
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .invite-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FEF3C7;
      color: #92400E;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 18px;
      border-radius: 100px;
      margin-bottom: 28px;
    }

    .logo {
      font-family: 'DM Serif Display', serif;
      font-size: 38px;
      font-weight: 400;
      color: var(--text-dark);
      margin-bottom: 8px;
    }

    .logo em {
      font-style: italic;
      color: var(--accent);
    }

    .subtitle {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      color: var(--text-muted);
      font-weight: 600;
      margin-bottom: 32px;
    }

    .invite-msg {
      font-size: 17px;
      line-height: 1.6;
      color: #44403C;
      margin-bottom: 12px;
    }

    .code-display {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #FFF7ED;
      border: 2px dashed rgba(232,135,45,0.3);
      border-radius: 16px;
      padding: 14px 28px;
      margin: 20px 0 28px;
    }

    .code-display .label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .code-display .code {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 3px;
      color: var(--accent);
      font-family: 'Outfit', monospace;
    }

    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--text-dark);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 18px 44px;
      border-radius: 100px;
      text-decoration: none;
      transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
      box-shadow: 0 8px 24px rgba(28,25,23,0.12);
    }

    .download-btn:hover {
      background: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(232,135,45,0.3);
    }

    .reward-hint {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 20px;
      line-height: 1.5;
    }

    .reward-hint strong {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="invite-badge">🎉 You're Invited!</div>

    <div class="logo">Meet<em>Over</em>Meal</div>
    <div class="subtitle">Dine together &middot; connect</div>

    <p class="invite-msg">
      Your friend wants to dine with you!<br>
      Download the app and enter their invite code:
    </p>

    <div class="code-display" id="code-section" style="display:none;">
      <span class="label">Code:</span>
      <span class="code" id="invite-code">------</span>
    </div>

    <a class="download-btn" href="https://apps.apple.com/us/app/meetovermeal/id6762139752">
      <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83"/><path d="M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11"/></svg>
      Get the App
    </a>

    <p class="reward-hint">
      Both you and your friend get a free <strong>⚡ Super Like</strong> when you sign up!
    </p>
  </div>

  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var code = params.get('code');
      if (code) {
        document.getElementById('invite-code').textContent = code.toUpperCase();
        document.getElementById('code-section').style.display = 'inline-flex';
      }
    })();
  </script>
</body>
</html>
