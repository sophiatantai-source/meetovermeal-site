<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetOverMeal - Join this Meetup</title>
  <meta name="description" content="Join a food meetup on MeetOverMeal — dine together, meet new people!">
  <!-- Open Graph for WeChat, WhatsApp, etc. -->
  <meta property="og:title" content="You're Invited · MeetOverMeal">
  <meta property="og:description" content="Join an exclusive culinary experience. Tap to view meetup details and secure your seat at the table.">
  <meta property="og:image" content="https://meetovermeal.org/meetup/share-card.png">
  <meta property="og:url" content="https://meetovermeal.org/meetup">
  <meta property="og:type" content="website">
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="You're Invited · MeetOverMeal">
  <meta name="twitter:description" content="Join an exclusive culinary experience. Tap to view meetup details and secure your seat at the table.">
  <meta name="twitter:image" content="https://meetovermeal.org/meetup/share-card.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #F7F5F0;
      --card-bg: #FFFFFF;
      --text-dark: #1C1917;
      --text-muted: #78716C;
      --accent: #E85D04;
      --accent-hover: #DC2F02;
      --success: #16A34A;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 15% 0%, rgba(232, 93, 4, 0.04) 0%, transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(232, 93, 4, 0.06) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-dark);
      position: relative;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Premium noise texture overlay */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.35;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      background: var(--card-bg);
      border-radius: 28px;
      padding: 56px 48px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 32px 80px -16px rgba(28, 25, 23, 0.08), 
                  0 0 0 1px rgba(28, 25, 23, 0.04);
      z-index: 1;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(24px);
    }
    
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    .graphic-container {
      margin-bottom: 32px;
      position: relative;
      display: inline-block;
    }

    .graphic {
      width: 72px;
      height: 72px;
      background: #FFF8F3;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: inset 0 2px 12px rgba(232, 93, 4, 0.05),
                  0 8px 24px -6px rgba(232, 93, 4, 0.15);
      position: relative;
      z-index: 2;
    }

    .graphic-ring {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px dashed rgba(232, 93, 4, 0.2);
      animation: spin-slow 15s linear infinite;
      z-index: 1;
    }
    
    @keyframes spin-slow {
      to { transform: rotate(360deg); }
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text-dark);
      margin-bottom: 12px;
      line-height: 1.1;
    }
    
    .logo span { 
      color: var(--accent); 
      font-style: italic;
    }
    
    .subtitle {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: var(--text-muted);
      margin-bottom: 40px;
      font-weight: 600;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .open-app-btn {
      display: inline-block;
      background: var(--accent);
      color: #FFF;
      font-size: 16px;
      font-weight: 600;
      padding: 18px 48px;
      border-radius: 100px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(232, 93, 4, 0.3);
      width: 100%;
      max-width: 320px;
    }
    
    .open-app-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(232, 93, 4, 0.35);
    }

    .download-btn {
      display: inline-block;
      background: var(--text-dark);
      color: #FFF;
      font-size: 15px;
      font-weight: 500;
      padding: 16px 40px;
      border-radius: 100px;
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border: 1px solid transparent;
      box-shadow: 0 4px 12px rgba(28, 25, 23, 0.1);
      width: 100%;
      max-width: 320px;
    }
    
    .download-btn:hover {
      background: #292524;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(28, 25, 23, 0.15);
    }

    .divider {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }
    
    .hint {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 28px;
      font-weight: 300;
      line-height: 1.6;
    }

    .clipboard-toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--text-dark);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 12px 24px;
      border-radius: 100px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      z-index: 100;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .clipboard-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #FFF8F3;
      border: 1px solid rgba(232, 93, 4, 0.15);
      border-radius: 100px;
      padding: 8px 16px;
      margin-bottom: 28px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="graphic-container">
      <div class="graphic-ring"></div>
      <div class="graphic">🍷</div>
    </div>
    
    <div class="logo">Meet<span>Over</span>Meal</div>
    <div class="subtitle">Dine together &middot; connect</div>

    <div class="badge" id="badge" style="display: none;">
      <span class="badge-dot"></span>
      <span id="badge-text">Meetup invitation ready</span>
    </div>
    
    <div class="actions" id="actions">
      <!-- Dynamic content inserted by JS -->
    </div>
    
    <div class="hint" id="hint"></div>
  </div>

  <div class="clipboard-toast" id="toast">✓ Meetup link copied — it'll open automatically after install</div>

  <script>
    (function() {
      var APP_STORE_URL = 'https://apps.apple.com/us/app/meetovermeal/id6762139752';
      var CUSTOM_SCHEME = 'meetovermeal://';

      // Extract meetup ID from query string
      var params = new URLSearchParams(window.location.search);
      var meetupId = params.get('id');
      var actionsEl = document.getElementById('actions');
      var hintEl = document.getElementById('hint');
      var badgeEl = document.getElementById('badge');
      var badgeTextEl = document.getElementById('badge-text');

      /**
       * If this page loads, it means one of:
       * 1. App is NOT installed (Universal Links didn't intercept)
       * 2. User typed the URL directly into Safari address bar
       * 3. User opened link from a context where Universal Links don't work
       * 
       * In all cases, we should:
       * a) Try custom scheme as a secondary attempt to open the app
       * b) Copy the deep link to clipboard for deferred deep linking
       * c) Show download button as fallback
       */

      if (meetupId) {
        var deepLink = CUSTOM_SCHEME + 'meetup?id=' + encodeURIComponent(meetupId);
        var universalLink = 'https://meetovermeal.org/meetup/?id=' + encodeURIComponent(meetupId);

        badgeTextEl.textContent = 'Meetup invitation ready';
        badgeEl.style.display = 'inline-flex';

        // Copy deep link to clipboard for deferred deep linking (new installs)
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(deepLink).catch(function() {});
          }
        } catch(e) {}

        // Build action buttons
        actionsEl.innerHTML =
          '<a class="open-app-btn" id="open-btn" href="' + deepLink + '">Open in App</a>' +
          '<span class="divider">or</span>' +
          '<a class="download-btn" id="dl-btn" href="' + APP_STORE_URL + '">Download on App Store</a>';

        hintEl.innerHTML = 'If you already have the app, tap <strong>Open in App</strong>.<br>New here? Download first — the meetup link will be waiting for you.';

        // When "Open in App" is clicked, try custom scheme.
        // If it fails (app not installed), the page stays visible.
        var openBtn = document.getElementById('open-btn');
        openBtn.addEventListener('click', function(e) {
          e.preventDefault();

          // Copy to clipboard again just in case
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(deepLink).catch(function() {});
            }
          } catch(ex) {}

          // Try opening via custom scheme
          window.location.href = deepLink;

          // If app didn't open after 2s, show toast about clipboard
          setTimeout(function() {
            if (!document.hidden) {
              showToast();
            }
          }, 2000);
        });

      } else {
        // No meetup ID — generic landing
        actionsEl.innerHTML =
          '<a class="download-btn" href="' + APP_STORE_URL + '">Download on App Store</a>';
        hintEl.textContent = 'Discover food meetups nearby and dine with interesting people.';
      }

      function showToast() {
        var toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(function() {
          toast.classList.remove('show');
        }, 4000);
      }

      // If page becomes hidden (app opened successfully), no further action needed
      document.addEventListener('visibilitychange', function() {
        // App opened — nothing to do
      });
    })();
  </script>
</body>
</html>
