          { heading: '1. Información que Recopilamos', content: '<p>Cuando usa MeetOverMeal, recopilamos los siguientes tipos de información:</p><ul><li><strong>Información de Cuenta:</strong> Correo electrónico, número de teléfono, nombre, edad, género, ciudad y fotos de perfil que proporciona durante el registro.</li><li><strong>Datos de Ubicación:</strong> Su ubicación aproximada para mostrar restaurantes cercanos y verificar el registro en encuentros. Solo se accede a la ubicación cuando usa la aplicación.</li><li><strong>Datos de Uso:</strong> Información sobre cómo interactúa con la aplicación, incluyendo encuentros creados, solicitudes enviadas y mensajes de chat.</li><li><strong>Datos de Pago:</strong> La información de pago se procesa de forma segura a través de Stripe. No almacenamos los datos completos de su tarjeta en nuestros servidores.</li><li><strong>Información del Dispositivo:</strong> Tipo de dispositivo, sistema operativo y tokens de notificaciones push para entregar notificaciones.</li></ul>' },

          { heading: '1. Informations Collectées', content: '<p>Lorsque vous utilisez MeetOverMeal, nous collectons les types d\'informations suivants :</p><ul><li><strong>Informations de Compte :</strong> Adresse e-mail, numéro de téléphone, nom, âge, genre, ville et photos que vous fournissez lors de l\'inscription.</li><li><strong>Données de Localisation :</strong> Votre position approximative pour afficher les restaurants à proximité et vérifier l\'enregistrement. La localisation n\'est consultée que lorsque vous utilisez l\'application.</li><li><strong>Données d\'Utilisation :</strong> Comment vous interagissez avec l\'application, repas créés, candidatures soumises et messages.</li><li><strong>Données de Paiement :</strong> Les informations de paiement sont traitées en toute sécurité par Stripe. Nous ne stockons pas vos données bancaires complètes.</li><li><strong>Informations sur l\'Appareil :</strong> Type d\'appareil, système d\'exploitation et jetons de notifications push.</li></ul>' },
          { heading: '2. Utilisation de vos Informations', content: '<ul><li>Pour créer et gérer votre compte</li><li>Pour vous associer à des repas et partenaires à proximité</li><li>Pour traiter les cautions, remboursements et pénalités via notre prestataire de paiement</li><li>Pour envoyer des notifications push sur les mises à jour, messages et statuts</li><li>Pour vérifier votre position lors des enregistrements au restaurant</li><li>Pour appliquer les règles de la communauté et prévenir les abus</li><li>Pour améliorer l\'expérience et corriger les bugs</li></ul>' },
          { heading: '3. Partage d\'Informations', content: '<p>Nous ne vendons pas vos informations personnelles. Nous pouvons partager des données limitées avec :</p><ul><li><strong>Autres Utilisateurs :</strong> Votre profil public est visible pendant le processus de mise en relation.</li><li><strong>Prestataires de Services :</strong> Stripe (paiements), Supabase (base de données) et Sentry (rapports de crash).</li><li><strong>Exigences Légales :</strong> Lorsque requis par la loi ou pour protéger la sécurité.</li></ul>' },
          { heading: '4. Conservation des Données', content: '<p>Nous conservons vos données tant que votre compte est actif. Vous pouvez demander la suppression à tout moment via les paramètres du Profil. Après suppression, vos données sont définitivement effacées sous 30 jours.</p>' },
          { heading: '5. Sécurité des Données', content: '<p>Nous utilisons un chiffrement standard (TLS/SSL) pour toutes les données en transit. Les données de paiement sont gérées exclusivement par Stripe, conforme PCI. L\'accès aux données est restreint au personnel autorisé.</p>' },
          { heading: '6. Vos Droits', content: '<p>Vous avez le droit de :</p><ul><li>Accéder à vos données personnelles via votre profil</li><li>Corriger les informations inexactes en modifiant votre profil</li><li>Supprimer votre compte et toutes les données associées</li><li>Désactiver les notifications push via les paramètres de l\'appareil</li></ul>' },
          { heading: '7. Vie Privée des Enfants', content: '<p>MeetOverMeal n\'est pas destiné aux utilisateurs de moins de 18 ans. Nous ne collectons pas sciemment d\'informations personnelles auprès des enfants.</p>' },
          { heading: '8. Modifications de cette Politique', content: '<p>Nous pouvons mettre à jour cette Politique périodiquement. Nous vous informerons des changements importants via l\'application ou par e-mail.</p>' },
          { heading: '9. Nous Contacter', content: '<p>Pour toute question, contactez-nous à <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },
        ],
      },
      de: {
        back: '← Zurück zur Startseite',
        title: 'Datenschutzrichtlinie',
        updated: 'Letzte Aktualisierung: 4. April 2026',
        sections: [
          { heading: '1. Erfasste Informationen', content: '<p>Bei der Nutzung von MeetOverMeal erfassen wir folgende Informationen:</p><ul><li><strong>Kontoinformationen:</strong> E-Mail, Telefonnummer, Name, Alter, Geschlecht, Stadt und Profilfotos bei der Registrierung.</li><li><strong>Standortdaten:</strong> Ihr ungefährer Standort für nahegelegene Restaurants und Check-in-Verifizierung. Nur während der App-Nutzung.</li><li><strong>Nutzungsdaten:</strong> Interaktionen mit der App, erstellte Treffen, eingereichte Bewerbungen und Chat-Nachrichten.</li><li><strong>Zahlungsdaten:</strong> Werden sicher über Stripe verarbeitet. Vollständige Kartendaten werden nicht gespeichert.</li><li><strong>Geräteinformationen:</strong> Gerätetyp, Betriebssystem und Push-Benachrichtigungstoken.</li></ul>' },
          { heading: '2. Verwendung Ihrer Informationen', content: '<ul><li>Erstellung und Verwaltung Ihres Kontos</li><li>Zuordnung zu nahegelegenen Treffen und Essenspartnern</li><li>Verarbeitung von Kautionen, Erstattungen und Strafen</li><li>Push-Benachrichtigungen zu Updates, Nachrichten und Bewerbungsstatus</li><li>Standortverifizierung für Restaurant-Check-ins</li><li>Durchsetzung der Community-Richtlinien</li><li>Verbesserung der App und Fehlerbehebung</li></ul>' },
          { heading: '3. Informationsweitergabe', content: '<p>Wir verkaufen keine personenbezogenen Daten. Wir teilen begrenzte Daten mit:</p><ul><li><strong>Andere Nutzer:</strong> Ihr öffentliches Profil ist beim Matching sichtbar.</li><li><strong>Dienstleister:</strong> Stripe (Zahlungen), Supabase (Datenbank), Sentry (Crash-Reports).</li><li><strong>Gesetzliche Anforderungen:</strong> Wenn gesetzlich erforderlich oder zum Schutz der Sicherheit.</li></ul>' },
          { heading: '4. Datenspeicherung', content: '<p>Wir speichern Ihre Daten solange Ihr Konto aktiv ist. Löschung kann jederzeit über die Profileinstellungen angefordert werden. Nach Löschung werden Daten innerhalb von 30 Tagen dauerhaft entfernt.</p>' },
          { heading: '5. Datensicherheit', content: '<p>Wir verwenden branchenübliche Verschlüsselung (TLS/SSL). Zahlungsdaten werden ausschließlich von Stripe verarbeitet. Zugang zu Nutzerdaten ist auf autorisiertes Personal beschränkt.</p>' },
          { heading: '6. Ihre Rechte', content: '<p>Sie haben das Recht:</p><ul><li>Über Ihr Profil auf persönliche Daten zuzugreifen</li><li>Ungenaue Informationen durch Profilbearbeitung zu korrigieren</li><li>Ihr Konto und alle zugehörigen Daten zu löschen</li><li>Push-Benachrichtigungen über Geräteeinstellungen zu deaktivieren</li></ul>' },
          { heading: '7. Datenschutz für Kinder', content: '<p>MeetOverMeal ist nicht für Nutzer unter 18 Jahren bestimmt. Wir sammeln nicht wissentlich Daten von Kindern.</p>' },
          { heading: '8. Änderungen dieser Richtlinie', content: '<p>Wir können diese Richtlinie gelegentlich aktualisieren. Über wesentliche Änderungen informieren wir Sie per App oder E-Mail.</p>' },
          { heading: '9. Kontakt', content: '<p>Bei Fragen kontaktieren Sie uns unter <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },
        ],
      },
      pt: {
        back: '← Voltar ao início',
        title: 'Política de Privacidade',
        updated: 'Última atualização: 4 de abril de 2026',
        sections: [
          { heading: '1. Informações que Coletamos', content: '<p>Ao usar o MeetOverMeal, coletamos os seguintes tipos de informações:</p><ul><li><strong>Informações da Conta:</strong> E-mail, telefone, nome, idade, gênero, cidade e fotos fornecidos no cadastro.</li><li><strong>Dados de Localização:</strong> Sua localização aproximada para mostrar restaurantes próximos e verificar check-in. Acessada apenas durante o uso do app.</li><li><strong>Dados de Uso:</strong> Interações com o app, encontros criados, candidaturas e mensagens.</li><li><strong>Dados de Pagamento:</strong> Processados de forma segura pelo Stripe. Não armazenamos dados completos do cartão.</li><li><strong>Informações do Dispositivo:</strong> Tipo de dispositivo, sistema operacional e tokens de notificação push.</li></ul>' },
          { heading: '2. Como Usamos suas Informações', content: '<ul><li>Para criar e gerenciar sua conta</li><li>Para conectá-lo a encontros e parceiros de refeição próximos</li><li>Para processar depósitos, reembolsos e penalidades</li><li>Para enviar notificações push sobre atualizações, mensagens e status</li><li>Para verificar sua localização para check-ins</li><li>Para aplicar diretrizes da comunidade e prevenir abusos</li><li>Para melhorar a experiência e corrigir bugs</li></ul>' },
          { heading: '3. Compartilhamento de Informações', content: '<p>Não vendemos suas informações pessoais. Podemos compartilhar dados limitados com:</p><ul><li><strong>Outros Usuários:</strong> Seu perfil público é visível durante o processo de match.</li><li><strong>Provedores de Serviço:</strong> Stripe (pagamentos), Supabase (banco de dados), Sentry (relatórios de erro).</li><li><strong>Requisitos Legais:</strong> Quando exigido por lei ou para proteção.</li></ul>' },
          { heading: '4. Retenção de Dados', content: '<p>Mantemos seus dados enquanto a conta estiver ativa. A exclusão pode ser solicitada a qualquer momento nas configurações do Perfil. Após exclusão, os dados são removidos permanentemente em 30 dias.</p>' },
          { heading: '5. Segurança dos Dados', content: '<p>Usamos criptografia padrão (TLS/SSL) para todos os dados em trânsito. Dados de pagamento são tratados exclusivamente pelo Stripe. O acesso é restrito ao pessoal autorizado.</p>' },
          { heading: '6. Seus Direitos', content: '<p>Você tem direito a:</p><ul><li>Acessar seus dados pessoais pelo perfil</li><li>Corrigir informações imprecisas editando o perfil</li><li>Excluir sua conta e todos os dados associados</li><li>Desativar notificações push nas configurações do dispositivo</li></ul>' },
          { heading: '7. Privacidade de Crianças', content: '<p>O MeetOverMeal não é destinado a menores de 18 anos. Não coletamos intencionalmente informações de crianças.</p>' },
          { heading: '8. Alterações nesta Política', content: '<p>Podemos atualizar esta Política periodicamente. Notificaremos sobre mudanças significativas pelo app ou e-mail.</p>' },
          { heading: '9. Contato', content: '<p>Dúvidas sobre esta Política? Contate-nos em <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },
        ],
      },
      ru: {
        back: '← Вернуться на главную',
        title: 'Политика Конфиденциальности',
        updated: 'Последнее обновление: 4 апреля 2026 г.',
        sections: [
          { heading: '1. Собираемая информация', content: '<p>При использовании MeetOverMeal мы собираем следующие типы информации:</p><ul><li><strong>Информация аккаунта:</strong> Email, телефон, имя, возраст, пол, город и фотографии профиля при регистрации.</li><li><strong>Данные о местоположении:</strong> Приблизительное местоположение для показа ближайших ресторанов и подтверждения прибытия. Доступ только при использовании приложения.</li><li><strong>Данные об использовании:</strong> Созданные встречи, заявки и сообщения в чате.</li><li><strong>Платёжные данные:</strong> Обрабатываются безопасно через Stripe. Полные данные карты не хранятся.</li><li><strong>Информация об устройстве:</strong> Тип устройства, ОС и токены push-уведомлений.</li></ul>' },
          { heading: '2. Использование информации', content: '<ul><li>Создание и управление аккаунтом</li><li>Подбор ближайших встреч и партнёров</li><li>Обработка залогов, возвратов и штрафов</li><li>Push-уведомления об обновлениях, сообщениях и статусах</li><li>Проверка местоположения для check-in</li><li>Соблюдение правил сообщества</li><li>Улучшение приложения и исправление ошибок</li></ul>' },
          { heading: '3. Передача информации', content: '<p>Мы не продаём вашу информацию. Мы можем делиться ограниченными данными с:</p><ul><li><strong>Другие пользователи:</strong> Ваш публичный профиль виден при подборе.</li><li><strong>Поставщики услуг:</strong> Stripe (платежи), Supabase (база данных), Sentry (отчёты о сбоях).</li><li><strong>Законные требования:</strong> По требованию закона или для защиты безопасности.</li></ul>' },
          { heading: '4. Хранение данных', content: '<p>Данные хранятся пока аккаунт активен. Удаление можно запросить через настройки профиля. После удаления данные безвозвратно удаляются в течение 30 дней.</p>' },
          { heading: '5. Безопасность данных', content: '<p>Используется стандартное шифрование (TLS/SSL). Платёжные данные обрабатываются только Stripe (PCI-совместимый). Доступ к данным ограничен авторизованным персоналом.</p>' },
          { heading: '6. Ваши права', content: '<p>Вы имеете право:</p><ul><li>Получить доступ к персональным данным через профиль</li><li>Исправить неточную информацию</li><li>Удалить аккаунт и все данные</li><li>Отключить push-уведомления в настройках устройства</li></ul>' },
          { heading: '7. Конфиденциальность детей', content: '<p>MeetOverMeal не предназначен для пользователей младше 18 лет. Мы не собираем информацию о детях намеренно.</p>' },
          { heading: '8. Изменения политики', content: '<p>Мы можем обновлять эту Политику. О существенных изменениях уведомим через приложение или email.</p>' },
          { heading: '9. Контакты', content: '<p>Вопросы? Пишите на <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },
        ],

        sections: [
          { heading: '1. المعلومات التي نجمعها', content: '<p>عند استخدامك لـ MeetOverMeal، نجمع الأنواع التالية من المعلومات:</p><ul><li><strong>معلومات الحساب:</strong> البريد الإلكتروني والهاتف والاسم والعمر والجنس والمدينة والصور.</li><li><strong>بيانات الموقع:</strong> موقعك التقريبي لعرض المطاعم القريبة والتحقق من تسجيل الحضور. يتم الوصول فقط عند استخدام التطبيق.</li><li><strong>بيانات الاستخدام:</strong> اللقاءات والطلبات والرسائل.</li><li><strong>بيانات الدفع:</strong> تتم معالجتها بأمان عبر Stripe. لا نخزن بيانات البطاقة الكاملة.</li><li><strong>معلومات الجهاز:</strong> نوع الجهاز ونظام التشغيل ورموز الإشعارات.</li></ul>' },
          { heading: '2. كيف نستخدم معلوماتك', content: '<ul><li>لإنشاء وإدارة حسابك</li><li>لربطك بلقاءات وشركاء طعام قريبين</li><li>لمعالجة التأمينات والمبالغ المستردة والغرامات</li><li>لإرسال إشعارات حول التحديثات والرسائل والحالات</li><li>للتحقق من موقعك لتسجيل الحضور</li><li>لتطبيق إرشادات المجتمع ومنع الإساءة</li><li>لتحسين التطبيق وإصلاح الأخطاء</li></ul>' },
          { heading: '3. مشاركة المعلومات', content: '<p>نحن لا نبيع معلوماتك. قد نشارك بيانات محدودة مع:</p><ul><li><strong>مستخدمون آخرون:</strong> ملفك الشخصي العام مرئي أثناء عملية المطابقة.</li><li><strong>مقدمو الخدمات:</strong> Stripe وSupabase وSentry.</li><li><strong>المتطلبات القانونية:</strong> عند الحاجة قانونيًا أو لحماية السلامة.</li></ul>' },
          { heading: '4. الاحتفاظ بالبيانات', content: '<p>نحتفظ ببياناتك طالما حسابك نشط. يمكنك طلب الحذف عبر إعدادات الملف الشخصي. تُحذف البيانات نهائيًا خلال 30 يومًا.</p>' },
          { heading: '5. أمن البيانات', content: '<p>نستخدم تشفير TLS/SSL. بيانات الدفع تُعالج حصريًا بواسطة Stripe. الوصول مقيد بالموظفين المصرح لهم فقط.</p>' },
          { heading: '6. حقوقك', content: '<p>لديك الحق في:</p><ul><li>الوصول إلى بياناتك الشخصية</li><li>تصحيح المعلومات غير الدقيقة</li><li>حذف حسابك وجميع البيانات</li><li>إلغاء الإشعارات من إعدادات الجهاز</li></ul>' },
          { heading: '7. خصوصية الأطفال', content: '<p>MeetOverMeal غير مخصص للمستخدمين دون 18 عامًا. نحن لا نجمع معلومات الأطفال عمدًا.</p>' },

      hi: {
        back: '← होम पर वापस जाएं',
        title: 'गोपनीयता नीति',
        updated: 'अंतिम अपडेट: 4 अप्रैल 2026',
        sections: [
          { heading: '1. हम कौन सी जानकारी एकत्र करते हैं', content: '<p>MeetOverMeal का उपयोग करते समय, हम निम्नलिखित प्रकार की जानकारी एकत्र करते हैं:</p><ul><li><strong>खाता जानकारी:</strong> पंजीकरण के दौरान प्रदान किए गए ईमेल, फ़ोन, नाम, आयु, लिंग, शहर और फ़ोटो।</li><li><strong>स्थान डेटा:</strong> नजदीकी रेस्तरां और चेक-इन सत्यापन के लिए आपका अनुमानित स्थान। केवल ऐप उपयोग के दौरान।</li><li><strong>उपयोग डेटा:</strong> बनाई गई मीटअप, जमा आवेदन और चैट संदेश।</li><li><strong>भुगतान डेटा:</strong> Stripe के माध्यम से सुरक्षित रूप से संसाधित। पूर्ण कार्ड विवरण संग्रहीत नहीं किए जाते।</li><li><strong>डिवाइस जानकारी:</strong> डिवाइस प्रकार, OS और पुश नोटिफ़िकेशन टोकन।</li></ul>' },
          { heading: '2. हम आपकी जानकारी का उपयोग कैसे करते हैं', content: '<ul><li>आपका खाता बनाने और प्रबंधित करने के लिए</li><li>नजदीकी मीटअप और भोजन साथी से मिलाने के लिए</li><li>जमा राशि, रिफंड और जुर्माना संसाधित करने के लिए</li><li>अपडेट, संदेश और स्थिति के बारे में पुश नोटिफ़िकेशन भेजने के लिए</li><li>चेक-इन के लिए स्थान सत्यापित करने के लिए</li><li>सामुदायिक दिशानिर्देश लागू करने और दुरुपयोग रोकने के लिए</li><li>ऐप अनुभव सुधारने और बग ठीक करने के लिए</li></ul>' },
          { heading: '3. जानकारी साझा करना', content: '<p>हम आपकी व्यक्तिगत जानकारी नहीं बेचते। हम सीमित डेटा साझा कर सकते हैं:</p><ul><li><strong>अन्य उपयोगकर्ता:</strong> आपकी सार्वजनिक प्रोफ़ाइल मैचिंग के दौरान दिखाई देती है।</li><li><strong>सेवा प्रदाता:</strong> Stripe, Supabase, Sentry।</li><li><strong>कानूनी आवश्यकताएं:</strong> कानून द्वारा आवश्यक होने पर या सुरक्षा के लिए।</li></ul>' },
          { heading: '4. डेटा प्रतिधारण', content: '<p>हम आपका डेटा तब तक रखते हैं जब तक आपका खाता सक्रिय है। प्रोफ़ाइल सेटिंग्स से कभी भी हटाने का अनुरोध कर सकते हैं। हटाने के बाद 30 दिनों में डेटा स्थायी रूप से हटा दिया जाता है।</p>' },
