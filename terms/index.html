          { heading: '10. Limitación de Responsabilidad', content: '<p>En la máxima medida permitida por la ley, MeetOverMeal no será responsable de ningún daño indirecto, incidental o consecuente que surja de su uso de la App.</p>' },
          { heading: '11. Cambios en los Términos', content: '<p>Nos reservamos el derecho de modificar estos Términos en cualquier momento. El uso continuado de la App después de los cambios constituye la aceptación de los Términos actualizados.</p>' },
          { heading: '12. Contacto', content: '<p>Para preguntas sobre estos Términos de Servicio, contáctenos en <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },

      fr: {

        sections: [
          { heading: '1. Acceptation des Conditions', content: '<p>En créant un compte ou en utilisant MeetOverMeal (« l\'Application »), vous acceptez d\'être lié(e) par ces Conditions d\'Utilisation. Si vous n\'êtes pas d\'accord, n\'utilisez pas l\'Application.</p>' },

      de: {

        title: 'Nutzungsbedingungen',
        updated: 'Letzte Aktualisierung: 4. April 2026',
        sections: [
          { heading: '1. Annahme der Bedingungen', content: '<p>Durch die Erstellung eines Kontos oder die Nutzung von MeetOverMeal („die App") stimmen Sie zu, an diese Nutzungsbedingungen gebunden zu sein. Wenn Sie nicht zustimmen, nutzen Sie die App nicht.</p>' },

          { heading: '3. Benutzerkonten', content: '<ul><li>Sie sind verantwortlich für die Sicherheit Ihrer Kontodaten.</li><li>Sie müssen genaue und vollständige Profilinformationen angeben.</li><li>Sie dürfen keine Konten für andere erstellen oder Ihr Konto übertragen.</li><li>Sie können Ihr Konto jederzeit über die Profileinstellungen löschen.</li></ul>' },
          { heading: '4. Essens-System & Kaution', content: '<ul><li><strong>Kaution:</strong> Bei der Bewerbung für ein Treffen wird eine Kaution von 5 USD über Stripe vorübergehend eingefroren.</li><li><strong>Erfolgreiches Treffen:</strong> Wenn beide Parteien im Restaurant einchecken, wird die Kaution vollständig erstattet.</li><li><strong>Nichterscheinen:</strong> Wenn Sie nicht innerhalb des vorgesehenen Zeitfensters einchecken, wird Ihre Kaution zur Entschädigung der anderen Partei einbehalten.</li><li><strong>Stornierung:</strong> Kostenlose Stornierung vor einem Match. Nach Bestätigung eines Matches fällt eine Strafe von 3 $ an.</li></ul>' },
          { heading: '5. Community-Richtlinien', content: '<p>Sie stimmen zu, NICHT:</p><ul><li>Pornografische, gewalttätige, bedrohende oder missbräuchliche Inhalte zu veröffentlichen</li><li>Andere Benutzer zu belästigen, zu mobben oder einzuschüchtern</li><li>Falsche oder irreführende Profile zu erstellen</li><li>Die App für illegale Zwecke zu nutzen</li><li>Spam oder unaufgeforderte kommerzielle Nachrichten zu senden</li><li>Das Kautionssystem zu umgehen</li></ul><p>Verstöße können zur sofortigen Kontosperrung oder zum permanenten Gerätebann führen. Wir betreiben ein 24-Stunden-Melde- und Überprüfungssystem.</p>' },
          { heading: '6. Eigentum an Inhalten', content: '<p>Sie behalten das Eigentum an von Ihnen veröffentlichten Inhalten (Fotos, Nachrichten, Erklärungen). Durch die Veröffentlichung gewähren Sie MeetOverMeal eine nicht-exklusive, lizenzgebührenfreie Lizenz zur Anzeige innerhalb der App zum Zweck der Diensterbringung.</p>' },
          { heading: '7. Blockieren & Melden', content: '<p>Sie können jederzeit jeden Benutzer blockieren oder melden. Das Blockieren eines Benutzers während eines aktiven Treffens kann zu einer Stornierungsstrafe gemäß Abschnitt 4 führen.</p>' },
          { heading: '8. Abonnements & Käufe', content: '<ul><li>Premium-Mitgliedschaften und Verbrauchsartikel sind über In-App-Käufe erhältlich.</li><li>Abonnements verlängern sich automatisch, sofern sie nicht mindestens 24 Stunden vor dem Verlängerungsdatum gekündigt werden.</li><li>Rückerstattungen für In-App-Käufe unterliegen den Richtlinien des App Store / Google Play.</li></ul>' },
          { heading: '9. Haftungsausschluss', content: '<p>MeetOverMeal ist eine Plattform, die soziale Verbindungen erleichtert. Wir sind nicht verantwortlich für das Verhalten einzelner Benutzer. Üben Sie immer persönliches Urteilsvermögen und Vorsicht aus, wenn Sie jemanden persönlich treffen.</p>' },
          { heading: '10. Haftungsbeschränkung', content: '<p>Im maximal gesetzlich zulässigen Umfang haftet MeetOverMeal nicht für indirekte, zufällige oder Folgeschäden, die aus Ihrer Nutzung der App entstehen.</p>' },
          { heading: '11. Änderungen der Bedingungen', content: '<p>Wir behalten uns das Recht vor, diese Bedingungen jederzeit zu ändern. Die fortgesetzte Nutzung der App nach Änderungen gilt als Annahme der aktualisierten Bedingungen.</p>' },
          { heading: '12. Kontakt', content: '<p>Bei Fragen zu diesen Nutzungsbedingungen kontaktieren Sie uns unter <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },

        sections: [
          { heading: '1. Aceitação dos Termos', content: '<p>Ao criar uma conta ou usar o MeetOverMeal ("o App"), você concorda em ficar vinculado a estes Termos de Serviço. Se não concordar, não use o App.</p>' },
          { heading: '2. Elegibilidade', content: '<p>Você deve ter pelo menos 18 anos para usar o MeetOverMeal. Ao usar o App, você declara e garante que atende a este requisito de idade.</p>' },

          { heading: '5. Diretrizes da Comunidade', content: '<p>Você concorda em NÃO:</p><ul><li>Publicar conteúdo pornográfico, violento, ameaçador ou abusivo</li><li>Assediar, intimidar ou ameaçar outros usuários</li><li>Criar perfis falsos ou enganosos</li><li>Usar o App para qualquer finalidade ilegal</li><li>Enviar spam ou mensagens comerciais não solicitadas</li><li>Tentar burlar o sistema de depósitos</li></ul><p>Violações podem resultar em suspensão imediata da conta ou banimento permanente do dispositivo. Operamos um sistema de denúncia e revisão 24 horas.</p>' },
          { heading: '6. Propriedade do Conteúdo', content: '<p>Você mantém a propriedade do conteúdo que publica (fotos, mensagens, declarações). Ao publicar conteúdo, você concede ao MeetOverMeal uma licença não exclusiva e livre de royalties para exibi-lo dentro do App com o objetivo de fornecer o serviço.</p>' },
          { heading: '7. Bloqueio e Denúncia', content: '<p>Você pode bloquear ou denunciar qualquer usuário a qualquer momento. Bloquear um usuário durante um encontro ativo pode resultar em uma penalidade de cancelamento conforme descrito na Seção 4.</p>' },
          { heading: '8. Assinaturas e Compras', content: '<ul><li>Assinaturas premium e itens consumíveis estão disponíveis através de compras no aplicativo.</li><li>As assinaturas são renovadas automaticamente, a menos que sejam canceladas pelo menos 24 horas antes da data de renovação.</li><li>Reembolsos de compras no aplicativo estão sujeitos às políticas da App Store / Google Play.</li></ul>' },
          { heading: '9. Isenção de Responsabilidade', content: '<p>O MeetOverMeal é uma plataforma que facilita conexões sociais. Não somos responsáveis pelo comportamento de usuários individuais. Sempre exerça seu julgamento pessoal e cautela ao encontrar alguém pessoalmente.</p>' },
          { heading: '10. Limitação de Responsabilidade', content: '<p>Na máxima extensão permitida por lei, o MeetOverMeal não será responsável por quaisquer danos indiretos, incidentais ou consequentes decorrentes do uso do App.</p>' },
          { heading: '11. Alterações nos Termos', content: '<p>Reservamo-nos o direito de modificar estes Termos a qualquer momento. O uso contínuo do App após as alterações constitui aceitação dos Termos atualizados.</p>' },
          { heading: '12. Contato', content: '<p>Para dúvidas sobre estes Termos de Serviço, entre em contato pelo <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },

      ru: {
        back: '← Вернуться на главную',
        title: 'Условия Использования',
        updated: 'Последнее обновление: 4 апреля 2026 г.',
        sections: [
          { heading: '1. Принятие условий', content: '<p>Создавая учётную запись или используя MeetOverMeal («Приложение»), вы соглашаетесь соблюдать настоящие Условия Использования. Если вы не согласны, не используйте Приложение.</p>' },
          { heading: '2. Право на использование', content: '<p>Для использования MeetOverMeal вам должно быть не менее 18 лет. Используя Приложение, вы подтверждаете и гарантируете соответствие этому возрастному требованию.</p>' },
          { heading: '3. Учётные записи', content: '<ul><li>Вы несёте ответственность за безопасность своих учётных данных.</li><li>Необходимо предоставить точную и полную информацию профиля.</li><li>Запрещено создавать учётные записи для других лиц или передавать свою учётную запись.</li><li>Вы можете удалить учётную запись в любое время через Настройки профиля.</li></ul>' },
          { heading: '4. Система встреч и залоги', content: '<ul><li><strong>Залоги:</strong> При подаче заявки или создании встречи через Stripe временно замораживается залог в размере $5.</li><li><strong>Успешная встреча:</strong> Если обе стороны зарегистрировались в ресторане, залоги полностью возвращаются.</li><li><strong>Неявка:</strong> Если вы не зарегистрируетесь в установленные сроки, залог удерживается в пользу другой стороны.</li><li><strong>Отмена:</strong> Бесплатная отмена до совпадения. После подтверждения совпадения взимается штраф $3.</li></ul>' },
          { heading: '5. Правила сообщества', content: '<p>Вы обязуетесь НЕ:</p><ul><li>Публиковать порнографический, насильственный, угрожающий или оскорбительный контент</li><li>Преследовать, запугивать или угрожать другим пользователям</li><li>Создавать фальшивые или вводящие в заблуждение профили</li><li>Использовать Приложение в незаконных целях</li><li>Рассылать спам или нежелательные коммерческие сообщения</li><li>Пытаться обойти систему залогов</li></ul><p>Нарушения могут привести к немедленной блокировке аккаунта или постоянному бану устройства. Мы работаем круглосуточно с жалобами и проверками.</p>' },
          { heading: '6. Право собственности на контент', content: '<p>Вы сохраняете права на публикуемый контент (фото, сообщения, декларации). Публикуя контент, вы предоставляете MeetOverMeal неисключительную безвозмездную лицензию на его отображение в Приложении для предоставления услуги.</p>' },
          { heading: '7. Блокировка и жалобы', content: '<p>Вы можете заблокировать или пожаловаться на любого пользователя в любое время. Блокировка пользователя во время активной встречи может повлечь штраф за отмену, описанный в Разделе 4.</p>' },
          { heading: '8. Подписки и покупки', content: '<ul><li>Премиум-подписки и расходные товары доступны через покупки в приложении.</li><li>Подписки продлеваются автоматически, если не отменены минимум за 24 часа до даты продления.</li><li>Возвраты за покупки в приложении регулируются политиками App Store / Google Play.</li></ul>' },
          { heading: '9. Отказ от ответственности', content: '<p>MeetOverMeal — платформа для социальных связей. Мы не несём ответственности за поведение отдельных пользователей. Всегда проявляйте осторожность при личных встречах.</p>' },
          { heading: '10. Ограничение ответственности', content: '<p>В максимальной степени, разрешённой законом, MeetOverMeal не несёт ответственности за косвенные, случайные или последующие убытки, возникшие в результате использования Приложения.</p>' },
          { heading: '11. Изменение условий', content: '<p>Мы оставляем за собой право изменять настоящие Условия в любое время. Продолжение использования Приложения после изменений означает принятие обновлённых Условий.</p>' },
          { heading: '12. Контакты', content: '<p>По вопросам об Условиях Использования обращайтесь по адресу <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },

      ar: {
        back: '← العودة للرئيسية',
        title: 'شروط الخدمة',
        updated: 'آخر تحديث: 4 أبريل 2026',
        sections: [
          { heading: '1. قبول الشروط', content: '<p>بإنشاء حساب أو استخدام MeetOverMeal ("التطبيق")، فإنك توافق على الالتزام بشروط الخدمة هذه. إذا كنت لا توافق، فلا تستخدم التطبيق.</p>' },
          { heading: '2. الأهلية', content: '<p>يجب أن يكون عمرك 18 عامًا على الأقل لاستخدام MeetOverMeal. باستخدام التطبيق، تقر وتضمن أنك تستوفي هذا الشرط العمري.</p>' },
          { heading: '3. حسابات المستخدمين', content: '<ul><li>تتحمل مسؤولية الحفاظ على أمان بيانات حسابك.</li><li>يجب تقديم معلومات ملف شخصي دقيقة وكاملة.</li><li>لا يجوز إنشاء حسابات لآخرين أو نقل حسابك.</li><li>يمكنك حذف حسابك في أي وقت من إعدادات الملف الشخصي.</li></ul>' },
          { heading: '4. نظام اللقاءات والتأمين', content: '<ul><li><strong>التأمين:</strong> عند التقدم للانضمام أو إنشاء لقاء، يتم تجميد تأمين بقيمة 5 دولارات مؤقتًا عبر Stripe.</li><li><strong>لقاء ناجح:</strong> إذا سجل الطرفان حضورهما في المطعم، يُسترد التأمين بالكامل.</li><li><strong>عدم الحضور:</strong> إذا لم تسجل حضورك خلال المهلة المحددة، يُصادر تأمينك لتعويض الطرف الآخر.</li><li><strong>الإلغاء:</strong> إلغاء مجاني قبل المطابقة. تُطبق غرامة 3 دولارات بعد تأكيد المطابقة.</li></ul>' },
          { heading: '5. إرشادات المجتمع', content: '<p>أنت توافق على عدم:</p><ul><li>نشر محتوى إباحي أو عنيف أو تهديدي أو مسيء</li><li>مضايقة أو تخويف أو ترهيب مستخدمين آخرين</li><li>إنشاء ملفات شخصية مزيفة أو مضللة</li><li>استخدام التطبيق لأي غرض غير قانوني</li><li>إرسال رسائل غير مرغوبة أو تجارية</li><li>محاولة التحايل على نظام التأمين</li></ul><p>قد تؤدي المخالفات إلى تعليق الحساب فورًا أو حظر الجهاز نهائيًا. نحن نعمل بنظام إبلاغ ومراجعة على مدار 24 ساعة.</p>' },
          { heading: '6. ملكية المحتوى', content: '<p>تحتفظ بملكية المحتوى الذي تنشره (الصور والرسائل والإعلانات). بنشر المحتوى، تمنح MeetOverMeal ترخيصًا غير حصري وبدون حقوق ملكية لعرضه داخل التطبيق لغرض تقديم الخدمة.</p>' },
          { heading: '7. الحظر والإبلاغ', content: '<p>يمكنك حظر أو الإبلاغ عن أي مستخدم في أي وقت. قد يؤدي حظر مستخدم أثناء لقاء نشط إلى غرامة إلغاء كما هو موضح في القسم 4.</p>' },
          { heading: '8. الاشتراكات والمشتريات', content: '<ul><li>العضويات المميزة والعناصر الاستهلاكية متاحة عبر عمليات الشراء داخل التطبيق.</li><li>تتجدد الاشتراكات تلقائيًا ما لم يتم إلغاؤها قبل 24 ساعة على الأقل من تاريخ التجديد.</li><li>تخضع المبالغ المستردة لسياسات App Store / Google Play.</li></ul>' },
          { heading: '9. إخلاء المسؤولية', content: '<p>MeetOverMeal منصة لتسهيل التواصل الاجتماعي. نحن غير مسؤولين عن سلوك المستخدمين الأفراد. مارس دائمًا حكمك الشخصي والحذر عند مقابلة شخص ما.</p>' },
          { heading: '10. تحديد المسؤولية', content: '<p>إلى أقصى حد يسمح به القانون، لن تكون MeetOverMeal مسؤولة عن أي أضرار غير مباشرة أو عرضية أو تبعية ناتجة عن استخدامك للتطبيق.</p>' },
          { heading: '11. تعديل الشروط', content: '<p>نحتفظ بالحق في تعديل هذه الشروط في أي وقت. يعتبر الاستمرار في استخدام التطبيق بعد التعديلات قبولًا للشروط المحدثة.</p>' },
          { heading: '12. اتصل بنا', content: '<p>للاستفسارات حول شروط الخدمة، تواصل معنا عبر <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },

      hi: {
        back: '← होम पर वापस जाएं',
        title: 'सेवा की शर्तें',
        updated: 'अंतिम अपडेट: 4 अप्रैल 2026',
        sections: [
          { heading: '1. शर्तों की स्वीकृति', content: '<p>खाता बनाकर या MeetOverMeal ("ऐप") का उपयोग करके, आप इन सेवा की शर्तों से बंधे होने के लिए सहमत होते हैं। यदि आप सहमत नहीं हैं, तो ऐप का उपयोग न करें।</p>' },
          { heading: '2. पात्रता', content: '<p>MeetOverMeal का उपयोग करने के लिए आपकी आयु कम से कम 18 वर्ष होनी चाहिए। ऐप का उपयोग करके, आप प्रतिनिधित्व करते हैं और गारंटी देते हैं कि आप इस आयु की आवश्यकता को पूरा करते हैं।</p>' },
          { heading: '3. उपयोगकर्ता खाते', content: '<ul><li>आप अपने खाता क्रेडेंशियल की सुरक्षा बनाए रखने के लिए जिम्मेदार हैं।</li><li>आपको सटीक और पूर्ण प्रोफ़ाइल जानकारी प्रदान करनी होगी।</li><li>आप अन्य लोगों के लिए खाते नहीं बना सकते या अपना खाता स्थानांतरित नहीं कर सकते।</li><li>आप प्रोफ़ाइल सेटिंग्स से कभी भी अपना खाता हटा सकते हैं।</li></ul>' },
          { heading: '4. मीटअप सिस्टम और जमा राशि', content: '<ul><li><strong>जमा राशि:</strong> जब आप किसी मीटअप में शामिल होने या मेजबानी करने के लिए आवेदन करते हैं, तो Stripe के माध्यम से $5 USD की जमा राशि अस्थायी रूप से फ्रीज की जाती है।</li><li><strong>सफल मीटअप:</strong> यदि दोनों पक्ष रेस्तरां में चेक-इन करते हैं, तो जमा राशि पूरी तरह से वापस कर दी जाती है।</li><li><strong>गैर-हाजिरी:</strong> यदि आप निर्दिष्ट समय के भीतर चेक-इन नहीं करते हैं, तो दूसरे पक्ष को क्षतिपूर्ति के लिए आपकी जमा राशि जब्त कर ली जाती है।</li><li><strong>रद्दीकरण:</strong> मैच से पहले मुफ्त रद्दीकरण। मैच की पुष्टि के बाद $3 का जुर्माना लागू होता है।</li></ul>' },
          { heading: '5. सामुदायिक दिशानिर्देश', content: '<p>आप निम्नलिखित न करने पर सहमत होते हैं:</p><ul><li>अश्लील, हिंसक, धमकी भरी या अपमानजनक सामग्री पोस्ट करना</li><li>अन्य उपयोगकर्ताओं को परेशान करना, धमकाना या डराना</li><li>नकली या भ्रामक प्रोफ़ाइल बनाना</li><li>किसी भी अवैध उद्देश्य के लिए ऐप का उपयोग करना</li><li>स्पैम या अनचाहे व्यावसायिक संदेश भेजना</li><li>जमा राशि प्रणाली को दरकिनार करने का प्रयास करना</li></ul><p>उल्लंघन के परिणामस्वरूप तत्काल खाता निलंबन या स्थायी डिवाइस प्रतिबंध हो सकता है। हम 24 घंटे की रिपोर्टिंग और समीक्षा प्रणाली संचालित करते हैं।</p>' },
          { heading: '6. सामग्री का स्वामित्व', content: '<p>आप अपनी पोस्ट की गई सामग्री (फ़ोटो, संदेश, घोषणाएं) का स्वामित्व बनाए रखते हैं। सामग्री पोस्ट करके, आप MeetOverMeal को सेवा प्रदान करने के उद्देश्य से ऐप के भीतर इसे प्रदर्शित करने का गैर-अनन्य, रॉयल्टी-मुक्त लाइसेंस प्रदान करते हैं।</p>' },
          { heading: '7. ब्लॉक करना और रिपोर्ट करना', content: '<p>आप किसी भी समय किसी भी उपयोगकर्ता को ब्लॉक या रिपोर्ट कर सकते हैं। सक्रिय मीटअप के दौरान किसी उपयोगकर्ता को ब्लॉक करने से धारा 4 में वर्णित रद्दीकरण जुर्माना हो सकता है।</p>' },
          { heading: '8. सदस्यता और खरीदारी', content: '<ul><li>प्रीमियम सदस्यता और उपभोज्य आइटम इन-ऐप खरीदारी के माध्यम से उपलब्ध हैं।</li><li>सदस्यता स्वचालित रूप से नवीनीकृत होती है जब तक कि नवीनीकरण तिथि से कम से कम 24 घंटे पहले रद्द नहीं किया जाता।</li><li>इन-ऐप खरीदारी के लिए रिफंड App Store / Google Play नीतियों के अधीन हैं।</li></ul>' },
          { heading: '9. अस्वीकरण', content: '<p>MeetOverMeal एक ऐसा प्लेटफ़ॉर्म है जो सामाजिक संपर्क को सुविधाजनक बनाता है। हम व्यक्तिगत उपयोगकर्ताओं के व्यवहार के लिए जिम्मेदार नहीं हैं। किसी से व्यक्तिगत रूप से मिलते समय हमेशा अपना व्यक्तिगत निर्णय और सावधानी बरतें।</p>' },
          { heading: '10. दायित्व की सीमा', content: '<p>कानून द्वारा अनुमत अधिकतम सीमा तक, MeetOverMeal ऐप के आपके उपयोग से उत्पन्न किसी भी अप्रत्यक्ष, आकस्मिक, या परिणामी क्षति के लिए उत्तरदायी नहीं होगा।</p>' },
          { heading: '11. शर्तों में परिवर्तन', content: '<p>हम किसी भी समय इन शर्तों को संशोधित करने का अधिकार सुरक्षित रखते हैं। परिवर्तनों के बाद ऐप का निरंतर उपयोग अपडेट की गई शर्तों की स्वीकृति मानी जाएगी।</p>' },
          { heading: '12. संपर्क करें', content: '<p>इन सेवा की शर्तों के बारे में प्रश्नों के लिए, <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a> पर संपर्क करें।</p>' },
        ],
      },
      th: {
        back: '← กลับหน้าหลัก',
        title: 'ข้อกำหนดการใช้งาน',
        updated: 'อัปเดตล่าสุด: 4 เมษายน 2026',
        sections: [
          { heading: '1. การยอมรับข้อกำหนด', content: '<p>การสร้างบัญชีหรือใช้ MeetOverMeal ("แอป") ถือว่าคุณยอมรับข้อกำหนดการใช้งานเหล่านี้ หากคุณไม่ยอมรับ กรุณาอย่าใช้แอป</p>' },
          { heading: '2. คุณสมบัติ', content: '<p>คุณต้องมีอายุอย่างน้อย 18 ปีเพื่อใช้ MeetOverMeal การใช้แอปถือว่าคุณรับรองและรับประกันว่าคุณมีคุณสมบัติตามข้อกำหนดอายุนี้</p>' },
          { heading: '3. บัญชีผู้ใช้', content: '<ul><li>คุณรับผิดชอบในการรักษาความปลอดภัยของข้อมูลบัญชี</li><li>คุณต้องให้ข้อมูลโปรไฟล์ที่ถูกต้องและครบถ้วน</li><li>ห้ามสร้างบัญชีให้ผู้อื่นหรือโอนบัญชี</li><li>คุณสามารถลบบัญชีได้ตลอดเวลาผ่านการตั้งค่าโปรไฟล์</li></ul>' },
          { heading: '4. ระบบนัดพบและเงินมัดจำ', content: '<ul><li><strong>เงินมัดจำ:</strong> เมื่อสมัครเข้าร่วมหรือจัดนัดพบ จะถูกอายัดเงินมัดจำ $5 ผ่าน Stripe ชั่วคราว</li><li><strong>นัดพบสำเร็จ:</strong> หากทั้งสองฝ่ายเช็คอินที่ร้านอาหาร เงินมัดจำจะคืนเต็มจำนวน</li><li><strong>ไม่มาตามนัด:</strong> หากไม่เช็คอินภายในเวลาที่กำหนด เงินมัดจำจะถูกริบเพื่อชดเชยอีกฝ่าย</li><li><strong>ยกเลิก:</strong> ยกเลิกฟรีก่อนจับคู่ หลังยืนยันจับคู่แล้วจะเสียค่าปรับ $3</li></ul>' },
          { heading: '5. กฎชุมชน', content: '<p>คุณยอมรับว่าจะไม่:</p><ul><li>โพสต์เนื้อหาลามก รุนแรง ข่มขู่ หรือล่วงละเมิด</li><li>คุกคาม กลั่นแกล้ง หรือข่มขู่ผู้ใช้คนอื่น</li><li>สร้างโปรไฟล์ปลอมหรือหลอกลวง</li><li>ใช้แอปเพื่อวัตถุประสงค์ที่ผิดกฎหมาย</li><li>ส่งสแปมหรือข้อความเชิงพาณิชย์ที่ไม่ได้รับอนุญาต</li><li>พยายามหลีกเลี่ยงระบบเงินมัดจำ</li></ul><p>การละเมิดอาจส่งผลให้ถูกระงับบัญชีทันทีหรือแบนอุปกรณ์ถาวร เราดำเนินระบบรายงานและตรวจสอบตลอด 24 ชั่วโมง</p>' },
          { heading: '6. ความเป็นเจ้าของเนื้อหา', content: '<p>คุณยังคงเป็นเจ้าของเนื้อหาที่โพสต์ (ภาพถ่าย ข้อความ ประกาศ) การโพสต์เนื้อหาถือว่าคุณให้สิทธิ์ MeetOverMeal ในการแสดงภายในแอปแบบไม่จำกัดเฉพาะและปลอดค่าลิขสิทธิ์เพื่อจัดหาบริการ</p>' },
          { heading: '7. การบล็อกและรายงาน', content: '<p>คุณสามารถบล็อกหรือรายงานผู้ใช้คนใดก็ได้ตลอดเวลา การบล็อกผู้ใช้ระหว่างนัดพบที่ยังดำเนินอยู่อาจส่งผลให้เกิดค่าปรับตามที่อธิบายในข้อ 4</p>' },
          { heading: '8. การสมัครสมาชิกและการซื้อ', content: '<ul><li>สมาชิกพรีเมียมและสิ่งของสิ้นเปลืองมีให้ผ่านการซื้อในแอป</li><li>การสมัครสมาชิกจะต่ออายุอัตโนมัติเว้นแต่ยกเลิกล่วงหน้าอย่างน้อย 24 ชั่วโมงก่อนวันต่ออายุ</li><li>การคืนเงินสำหรับการซื้อในแอปเป็นไปตามนโยบาย App Store / Google Play</li></ul>' },
          { heading: '9. ข้อจำกัดความรับผิดชอบ', content: '<p>MeetOverMeal เป็นแพลตฟอร์มที่อำนวยความสะดวกในการเชื่อมต่อทางสังคม เราไม่รับผิดชอบต่อพฤติกรรมของผู้ใช้แต่ละคน กรุณาใช้วิจารณญาณส่วนตัวและระมัดระวังเสมอเมื่อพบปะกับผู้คน</p>' },
          { heading: '10. การจำกัดความรับผิด', content: '<p>ในขอบเขตสูงสุดที่กฎหมายอนุญาต MeetOverMeal จะไม่รับผิดชอบต่อความเสียหายทางอ้อม โดยบังเอิญ หรือที่เป็นผลสืบเนื่องจากการใช้แอป</p>' },
          { heading: '11. การเปลี่ยนแปลงข้อกำหนด', content: '<p>เราขอสงวนสิทธิ์ในการแก้ไขข้อกำหนดเหล่านี้ได้ตลอดเวลา การใช้แอปต่อหลังจากมีการเปลี่ยนแปลงถือว่ายอมรับข้อกำหนดที่อัปเดต</p>' },
          { heading: '12. ติดต่อเรา', content: '<p>สำหรับคำถามเกี่ยวกับข้อกำหนดการใช้งาน ติดต่อเราที่ <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a></p>' },

      vi: {
        back: '← Quay lại trang chủ',
        title: 'Điều khoản Dịch vụ',
        updated: 'Cập nhật lần cuối: 4 tháng 4, 2026',
        sections: [
          { heading: '1. Chấp nhận Điều khoản', content: '<p>Bằng việc tạo tài khoản hoặc sử dụng MeetOverMeal ("Ứng dụng"), bạn đồng ý bị ràng buộc bởi các Điều khoản Dịch vụ này. Nếu bạn không đồng ý, vui lòng không sử dụng Ứng dụng.</p>' },
          { heading: '2. Điều kiện sử dụng', content: '<p>Bạn phải ít nhất 18 tuổi để sử dụng MeetOverMeal. Bằng việc sử dụng Ứng dụng, bạn tuyên bố và đảm bảo rằng bạn đáp ứng yêu cầu về độ tuổi này.</p>' },
          { heading: '3. Tài khoản Người dùng', content: '<ul><li>Bạn có trách nhiệm duy trì bảo mật thông tin đăng nhập.</li><li>Bạn phải cung cấp thông tin hồ sơ chính xác và đầy đủ.</li><li>Bạn không được tạo tài khoản cho người khác hoặc chuyển nhượng tài khoản.</li><li>Bạn có thể xóa tài khoản bất cứ lúc nào qua Cài đặt Hồ sơ.</li></ul>' },
          { heading: '4. Hệ thống Gặp mặt & Đặt cọc', content: '<ul><li><strong>Đặt cọc:</strong> Khi bạn đăng ký tham gia hoặc tổ chức buổi gặp, khoản đặt cọc $5 USD sẽ được tạm giữ qua Stripe.</li><li><strong>Gặp mặt thành công:</strong> Nếu cả hai bên check-in tại nhà hàng, tiền đặt cọc sẽ được hoàn trả đầy đủ.</li><li><strong>Vắng mặt:</strong> Nếu bạn không check-in trong thời gian quy định, tiền đặt cọc sẽ bị tịch thu để bồi thường cho bên còn lại.</li><li><strong>Hủy:</strong> Hủy miễn phí trước khi ghép đôi. Phí phạt $3 áp dụng sau khi xác nhận ghép đôi.</li></ul>' },
          { heading: '5. Quy tắc Cộng đồng', content: '<p>Bạn đồng ý KHÔNG:</p><ul><li>Đăng nội dung khiêu dâm, bạo lực, đe dọa hoặc lạm dụng</li><li>Quấy rối, bắt nạt hoặc đe dọa người dùng khác</li><li>Tạo hồ sơ giả hoặc gây hiểu lầm</li><li>Sử dụng Ứng dụng cho mục đích bất hợp pháp</li><li>Gửi thư rác hoặc tin nhắn thương mại không mong muốn</li><li>Cố gắng lách hệ thống đặt cọc</li></ul><p>Vi phạm có thể dẫn đến đình chỉ tài khoản ngay lập tức hoặc cấm thiết bị vĩnh viễn. Chúng tôi vận hành hệ thống báo cáo và xem xét 24 giờ.</p>' },
          { heading: '6. Quyền sở hữu Nội dung', content: '<p>Bạn giữ quyền sở hữu nội dung mà bạn đăng (ảnh, tin nhắn, tuyên bố). Bằng việc đăng nội dung, bạn cấp cho MeetOverMeal giấy phép không độc quyền, miễn phí bản quyền để hiển thị trong Ứng dụng nhằm mục đích cung cấp dịch vụ.</p>' },
          { heading: '7. Chặn & Báo cáo', content: '<p>Bạn có thể chặn hoặc báo cáo bất kỳ người dùng nào bất cứ lúc nào. Chặn người dùng trong buổi gặp đang hoạt động có thể dẫn đến phí phạt hủy như mô tả trong Mục 4.</p>' },
          { heading: '8. Đăng ký & Mua hàng', content: '<ul><li>Gói thành viên cao cấp và vật phẩm tiêu hao có sẵn thông qua mua hàng trong ứng dụng.</li><li>Đăng ký tự động gia hạn trừ khi hủy trước ít nhất 24 giờ trước ngày gia hạn.</li><li>Hoàn tiền cho mua hàng trong ứng dụng tuân theo chính sách của App Store / Google Play.</li></ul>' },
          { heading: '9. Tuyên bố Miễn trừ', content: '<p>MeetOverMeal là nền tảng tạo điều kiện kết nối xã hội. Chúng tôi không chịu trách nhiệm về hành vi của từng người dùng. Hãy luôn sử dụng phán đoán cá nhân và thận trọng khi gặp ai đó trực tiếp.</p>' },
          { heading: '10. Giới hạn Trách nhiệm', content: '<p>Trong phạm vi tối đa được pháp luật cho phép, MeetOverMeal không chịu trách nhiệm cho bất kỳ thiệt hại gián tiếp, ngẫu nhiên hoặc hậu quả nào phát sinh từ việc bạn sử dụng Ứng dụng.</p>' },
          { heading: '11. Thay đổi Điều khoản', content: '<p>Chúng tôi có quyền sửa đổi các Điều khoản này bất cứ lúc nào. Việc tiếp tục sử dụng Ứng dụng sau khi thay đổi đồng nghĩa với việc chấp nhận các Điều khoản cập nhật.</p>' },
          { heading: '12. Liên hệ', content: '<p>Mọi thắc mắc về Điều khoản Dịch vụ này, hãy liên hệ <a href="mailto:feedback@meetovermeal.org">feedback@meetovermeal.org</a>.</p>' },

    function render() {
      const params = new URLSearchParams(window.location.search);
      const lang = params.get('lang') || navigator.language?.split('-')[0] || 'en';
      const t = translations[lang] || translations.en;

      document.documentElement.lang = lang;
      document.title = t.title + ' — MeetOverMeal';

      let html = `<h1>${t.title}</h1>`;
      html += `<p class="updated">${t.updated}</p>`;
      t.sections.forEach(s => {
        html += `<h2>${s.heading}</h2>${s.content}`;
      });

      document.getElementById('content').innerHTML = html;

      // RTL support for Arabic
      if (lang === 'ar') {
        document.documentElement.dir = 'rtl';
      }
    }

    render();
